<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notoria — личный блокнот и дневник</title>
    <meta
      name="description"
      content="Notoria — приложение для заметок, дневника и задач. Записи хранятся локально на вашем устройстве; резервное копирование в Google Drive и Яндекс.Диск — только по вашему желанию."
    />
    <meta name="theme-color" content="#1C1A17" />
    <meta property="og:title" content="Notoria — личный блокнот, который остаётся личным" />
    <meta property="og:description" content="Заметки, дневник и задачи. Офлайн, без рекламы и аналитики." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://notoria.kacbe.ru/" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <script>
      // Восстановление пути после редиректа с 404.html (GitHub Pages и подобные хостинги)
      (function () {
        var saved = sessionStorage.getItem("notoria:redirect");
        if (saved) {
          sessionStorage.removeItem("notoria:redirect");
          if (saved !== location.pathname + location.search + location.hash) {
            history.replaceState(null, "", saved);
          }
        }
      })();
    </script>
